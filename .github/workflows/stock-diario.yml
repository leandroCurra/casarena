name: Actualizar stock diario

on:
  schedule:
    - cron: "0 10 * * *"   # todos los días 07:00 de Argentina
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  stock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Leer stock y actualizar catalogo.json
        run: node .github/scripts/actualizar-stock.mjs
      - name: Guardar y publicar
        run: |
          if git diff --quiet catalogo.json; then echo "Sin cambios en el stock."; exit 0; fi
          git config user.name "casarena-stock"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.json
          git commit -m "Stock diario automático"
          git push
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
